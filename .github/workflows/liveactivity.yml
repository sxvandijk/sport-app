name: LiveActivity

# Test in de simulator of de Live Activity (Dynamic Island) iets laat zien en of de extensie crasht.
on:
  workflow_dispatch:
    inputs:
      runner:
        default: "macos-15"

permissions:
  contents: write

jobs:
  la:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Bouwen voor simulator
        run: |
          brew install xcodegen
          xcodegen generate
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          data=json.load(sys.stdin)['devices']
          pick=None
          for runtime in sorted(data):
              if 'iOS' not in runtime: continue
              for d in data[runtime]:
                  if d['name'].startswith('iPhone') and d['isAvailable'] and 'Pro' in d['name'] and 'Max' not in d['name']: pick=d['udid']
          print(pick)
          ")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild build -project SportApp.xcodeproj -scheme SportApp -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tail -5
      - name: Draaien
        run: |
          set +e
          mkdir -p out
          APP=$(find build/Build/Products -name "SportApp.app" -maxdepth 3 | head -1)
          find "$APP" -name "*.appex" > out/appex.txt
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.sxvandijk.sportapp -screenshotScreen workout-rest -liveActivityTest YES > out/launch.txt 2>&1
          sleep 6
          xcrun simctl io "$UDID" screenshot out/1-in-app.png
          xcrun simctl launch "$UDID" com.apple.Preferences
          sleep 4
          xcrun simctl io "$UDID" screenshot out/2-buiten-app.png
          sleep 3
          xcrun simctl spawn "$UDID" log show --last 2m --style compact \
            --predicate 'process == "SetWidgets" OR process == "SportApp" OR eventMessage CONTAINS "SetWidgets" OR eventMessage CONTAINS "WorkoutActivity" OR subsystem CONTAINS "ActivityKit"' 2>&1 | tail -n 300 > out/log.txt
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null > out/crashes.txt
          cp ~/Library/Logs/DiagnosticReports/*SetWidgets* out/ 2>/dev/null
      - name: Naar ci-results
        if: always()
        run: |
          set +e
          rm -rf "$RUNNER_TEMP/out"; cp -R out "$RUNNER_TEMP/out"
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git fetch origin ci-results 2>/dev/null
          git checkout -f -B ci-results origin/ci-results
          rm -rf results/liveactivity; mkdir -p results/liveactivity
          cp -R "$RUNNER_TEMP/out/." results/liveactivity/
          git add -f results
          git commit -m "Live Activity test" >/dev/null 2>&1
          git push origin ci-results || { git pull --rebase origin ci-results && git push origin ci-results; }
