name: IPA

# Maakt een installatiebestand (.ipa) zonder handtekening, om met Sideloadly op een telefoon te zetten.
# Handmatig starten via Actions -> IPA -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Bouwomgeving: macos-26 (met Liquid Glass) of macos-15 (sneller beschikbaar, zonder glas)"
        default: "macos-26"

permissions:
  contents: write

jobs:
  ipa:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen installeren en project maken
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Bouwen voor een echte telefoon (zonder handtekening)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SportApp.xcodeproj \
            -scheme SportApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tail -40

      - name: IPA maken
        run: |
          APP=$(find build/Build/Products -name "SportApp.app" -path "*Release-iphoneos*" | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          echo "Extensies in de app:"; find Payload -name "*.appex"
          zip -qry Set.ipa Payload
          ls -la Set.ipa

      - name: Inhoud van de IPA op branch ci-results zetten (om de extensie te controleren)
        if: always()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/ipainfo"
          OUT="$RUNNER_TEMP/ipainfo/ipa-info.txt"
          {
            echo "commit: $GITHUB_SHA"; echo "runner: $RUNNER_NAME"; xcodebuild -version
            echo "--- extensies"; find Payload -name "*.appex"
            echo "--- Payload"; find Payload -maxdepth 3 | head -60
            echo "--- app Info.plist"; plutil -p Payload/SportApp.app/Info.plist
            for A in $(find Payload -name "*.appex"); do echo "--- $A Info.plist"; plutil -p "$A/Info.plist"; done
          } > "$OUT" 2>&1
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git fetch origin ci-results 2>/dev/null
          if git rev-parse --verify origin/ci-results >/dev/null 2>&1; then
            git checkout -f -B ci-results origin/ci-results
          else
            git checkout -f --orphan ci-results; git rm -rf . >/dev/null 2>&1
          fi
          SAFE=$(echo "$BRANCH_NAME" | tr '/' '_')
          mkdir -p "results/$SAFE"
          cp "$OUT" "results/$SAFE/ipa-info.txt"
          git add -f results
          git commit -m "IPA-info voor $BRANCH_NAME" >/dev/null 2>&1
          git push origin ci-results || { git pull --rebase origin ci-results && git push origin ci-results; }
          git checkout -f - >/dev/null 2>&1

      - uses: actions/upload-artifact@v4
        with:
          name: Set-ipa
          path: Set.ipa
          retention-days: 14
