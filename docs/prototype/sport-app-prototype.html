<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sport App prototype</title>
<style>
  :root { --page: #1A1B1E; --pageText: #A9AEB6; --seg: #26282C; --segOn: #3A3D43; --segText: #F3F4F6; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --page: #E6E6E1; --pageText: #50545B; --seg: #D6D6D0; --segOn: #FFFFFF; --segText: #121316; }
  }
  :root[data-theme="light"] { --page: #E6E6E1; --pageText: #50545B; --seg: #D6D6D0; --segOn: #FFFFFF; --segText: #121316; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--page); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  .page { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; box-sizing: border-box; }
  .bar { display: flex; align-items: center; gap: 12px; color: var(--pageText); font-size: 13px; font-weight: 500; flex-wrap: wrap; justify-content: center; }
  .seg { display: flex; padding: 3px; border-radius: 10px; background: var(--seg); }
  .seg button { border: 0; background: none; font: inherit; font-weight: 600; color: var(--pageText); height: 30px; padding: 0 12px; border-radius: 8px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--segOn); color: var(--segText); }
  .stage { position: relative; }
  .phone { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; border-radius: 52px; overflow: hidden; box-shadow: 0 0 0 10px #050506, 0 0 0 11px #2C2E33; }
  /* basisregels voor de app */
  .app button, .app input { font: inherit; color: inherit; margin: 0; }
  .app button { border: 0; padding: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .app a { color: inherit; text-decoration: none; }
  /* op een telefoon: schermvullend, zonder rand */
  body.bare .page { padding: 0; gap: 0; }
  body.bare .bar { display: none; }
  body.bare .phone { border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<div class="page">
  <div class="bar">
    <span>Sport App · prototype</span>
    <span>Systeemmodus</span>
    <div class="seg" role="group" aria-label="Systeemmodus van de telefoon">
      <button type="button" data-mode="dark">Donker</button>
      <button type="button" data-mode="light">Licht</button>
    </div>
  </div>
  <div class="stage" id="stage"><div class="phone app" id="root"></div></div>
</div>

<template id="tpl"><div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

<!-- ================= STARTSCHERM ================= -->
<sc-if value="{{isTabs}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column">
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 55px 20px 24px">
    <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: center; gap: 4px">
      <div style="flex: 1; min-width: 0; font-size: 13px; font-weight: 500; color: {{t.text2}}">{{dateLabel}}</div>
      <button onClick="{{openGym}}" aria-label="{{gymAria}}" style="flex: none; height: 44px; display: flex; align-items: center">
        <span style="height: 32px; padding: 0 10px 0 8px; border-radius: 16px; background: {{t.raised}}; display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 600">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.3"></circle></svg>
          {{gymName}}
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </span>
      </button>
    </div>
    <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.6px">Training</h1>

    <div style="margin-top: 14px; background: {{t.surface}}; border-radius: 20px; padding: 6px 10px 6px">
      <button onClick="{{toggleCal}}" aria-expanded="{{calOpenStr}}" style="width: 100%; min-height: 52px; display: flex; align-items: center; gap: 10px; padding: 4px 8px; text-align: left">
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 13px; color: {{t.text2}}">Laatst getraind</span>
          <span style="display: block; font-size: 16px; font-weight: 600; margin-top: 1px">{{lastText}}</span>
        </span>
        <span style="text-align: right">
          <span style="display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 24px">{{weekCount}}</span>
          <span style="display: block; font-size: 12px; color: {{t.text2}}">deze week</span>
        </span>
        <span style="flex: none; color: {{t.text2}}; display: flex; transform: rotate({{calRot}}); transition: transform 0.2s">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </span>
      </button>
      <div style="display: flex">
        <sc-for list="{{weekdays}}" as="wd" hint-placeholder-count="7">
          <div style="flex: 1; text-align: center; font-size: 11px; font-weight: 600; color: {{t.text3}}; padding-bottom: 2px">{{wd}}</div>
        </sc-for>
      </div>
      <sc-for list="{{calWeeks}}" as="wk" hint-placeholder-count="5">
        <div style="display: flex">
          <sc-for list="{{wk.days}}" as="d" hint-placeholder-count="7">
            <button onClick="{{d.tap}}" aria-label="{{d.aria}}" style="flex: 1; height: 42px; display: flex; align-items: center; justify-content: center">
              <span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: {{d.bg}}; border: {{d.border}}; color: {{d.color}}; font-size: 14px; font-weight: {{d.weight}}; font-variant-numeric: tabular-nums">{{d.label}}</span>
            </button>
          </sc-for>
        </div>
      </sc-for>
      <sc-if value="{{showDayInfo}}">
        <div style="font-size: 13px; color: {{t.text2}}; padding: 4px 8px 6px">{{dayInfo}}</div>
      </sc-if>
    </div>

    <div style="margin: 22px 0 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.text2}}">Mijn schema</div>
    <button onClick="{{openProgram}}" aria-label="{{progAria}}" style="width: 100%; min-height: 52px; display: flex; align-items: center; gap: 8px; text-align: left">
      <span style="flex: 1; min-width: 0">
        <span style="display: block; font-size: 22px; font-weight: 700; letter-spacing: -0.3px">{{progName}}</span>
        <span style="display: block; font-size: 13px; color: {{t.text2}}; margin-top: 1px">{{progSub}}</span>
      </span>
      <span style="flex: none; height: 32px; padding: 0 12px; border-radius: 16px; background: {{t.raised}}; display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600">Wissel
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </span>
    </button>
    <div style="height: 8px"></div>
    <sc-for list="{{templates}}" as="tp" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; min-height: 72px; border-radius: 16px; background: {{t.surface}}; margin-bottom: 8px">
        <button onClick="{{tp.open}}" aria-label="{{tp.openAria}}" style="flex: 1; min-width: 0; min-height: 72px; padding: 12px 4px 12px 16px; text-align: left">
          <span style="display: flex; align-items: center; gap: 8px">
            <span style="font-size: 17px; font-weight: 600">{{tp.name}}</span>
            <sc-if value="{{tp.isNext}}"><span style="height: 22px; padding: 0 8px; border-radius: 11px; background: {{t.accentSoft}}; color: {{t.accentText}}; font-size: 12px; font-weight: 700; display: flex; align-items: center">Volgende</span></sc-if>
          </span>
          <span style="display: block; font-size: 13px; color: {{t.text2}}; margin-top: 3px">{{tp.sub}}</span>
          <span style="display: block; font-size: 13px; color: {{t.text2}}; margin-top: 1px">{{tp.muscles}}</span>
        </button>
        <button onClick="{{tp.more}}" aria-label="{{tp.moreAria}}" style="flex: none; width: 48px; height: 48px; margin-right: 4px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: {{t.text2}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.9"></circle><circle cx="12" cy="12" r="1.9"></circle><circle cx="19" cy="12" r="1.9"></circle></svg>
        </button>
      </div>
    </sc-for>
    <sc-if value="{{progEmpty}}">
      <div style="padding: 16px 4px; font-size: 15px; color: {{t.text2}}">Dit schema heeft nog geen trainingen.</div>
    </sc-if>
    <button onClick="{{newTemplate}}" style="width: 100%; height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; color: {{t.accentText}}; font-size: 15px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Training toevoegen aan schema
    </button>

    <button onClick="{{startEmpty}}" style="margin-top: 16px; width: 100%; min-height: 64px; display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-radius: 16px; background: {{t.surface}}; text-align: left">
      <span style="flex: none; width: 36px; height: 36px; border-radius: 18px; background: {{t.raised}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </span>
      <span style="flex: 1; min-width: 0">
        <span style="display: block; font-size: 17px; font-weight: 600">Vrije training</span>
        <span style="display: block; font-size: 13px; color: {{t.text2}}; margin-top: 2px">Kies je oefeningen tijdens het trainen</span>
      </span>
    </button>
    </sc-if>

    <!-- ===== PROGRESSIE ===== -->
    <sc-if value="{{isProgress}}" hint-placeholder-val="{{ false }}">
      <div style="height: 44px; display: flex; align-items: center; font-size: 13px; font-weight: 500; color: {{t.text2}}">Laatste 4 weken</div>
      <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.6px">Progressie</h1>
      <div style="display: flex; gap: 12px; margin-top: 18px">
        <sc-for list="{{pStats}}" as="ps" hint-placeholder-count="3">
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 26px; font-weight: 600; letter-spacing: -0.4px; font-variant-numeric: tabular-nums">{{ps.v}}</div>
            <div style="font-size: 13px; color: {{t.text2}}">{{ps.l}}</div>
          </div>
        </sc-for>
      </div>

      <div style="margin-top: 20px; background: {{t.surface}}; border-radius: 20px; padding: 16px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <div style="font-size: 17px; font-weight: 600">Volume per week</div>
          <div style="font-size: 13px; color: {{t.text2}}">x 1.000 kg</div>
        </div>
        <div style="display: flex; align-items: flex-end; gap: 8px; height: 120px; margin-top: 14px">
          <sc-for list="{{pWeeks}}" as="b" hint-placeholder-count="8">
            <div style="flex: 1; height: {{b.h}}; border-radius: 6px; background: {{b.bg}}"></div>
          </sc-for>
        </div>
        <div style="display: flex; gap: 8px; margin-top: 6px">
          <sc-for list="{{pWeeks}}" as="b" hint-placeholder-count="8">
            <div style="flex: 1; text-align: center; font-size: 11px; color: {{t.text3}}; font-variant-numeric: tabular-nums">{{b.l}}</div>
          </sc-for>
        </div>
        <div style="font-size: 13px; color: {{t.text2}}; margin-top: 10px">Deze week tot nu toe 6.240 kg</div>
      </div>

      <div style="margin-top: 12px; background: {{t.surface}}; border-radius: 20px; padding: 16px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px">
          <div style="font-size: 17px; font-weight: 600">Sets per spiergroep</div>
          <div style="font-size: 13px; color: {{t.text2}}">deze week</div>
        </div>
        <sc-for list="{{pMuscles}}" as="m" hint-placeholder-count="8">
          <div style="display: flex; align-items: center; gap: 12px; height: 30px">
            <div style="width: 92px; font-size: 15px">{{m.name}}</div>
            <div style="flex: 1; height: 8px; border-radius: 4px; background: {{t.track}}"><div style="height: 8px; width: {{m.w}}; border-radius: 4px; background: {{t.accentLine}}"></div></div>
            <div style="width: 24px; text-align: right; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{m.v}}</div>
          </div>
        </sc-for>
      </div>

      <div style="margin: 24px 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.text2}}">Persoonlijke records</div>
      <sc-for list="{{pRecords}}" as="pr" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0">
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 16px; font-weight: 500">{{pr.name}}</div>
            <div style="font-size: 13px; color: {{t.text2}}; margin-top: 2px; font-variant-numeric: tabular-nums">{{pr.sub}}</div>
          </div>
          <div style="font-size: 13px; color: {{t.text2}}">{{pr.date}}</div>
        </div>
      </sc-for>
    </sc-if>

    <!-- ===== PROFIEL ===== -->
    <sc-if value="{{isProfile}}" hint-placeholder-val="{{ false }}">
      <div style="height: 44px"></div>
      <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.6px">Profiel</h1>
      <div style="display: flex; align-items: center; gap: 14px; margin-top: 16px; padding: 14px 16px; border-radius: 16px; background: {{t.surface}}">
        <span style="flex: none; width: 52px; height: 52px; border-radius: 26px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700">S</span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 19px; font-weight: 600">Stan</span>
          <span style="display: block; font-size: 13px; color: {{t.text2}}; margin-top: 2px; font-variant-numeric: tabular-nums">48 trainingen · sinds juli 2026</span>
        </span>
      </div>

      <div style="margin: 24px 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.text2}}">Weergave</div>
      <div style="padding: 14px 16px 16px; border-radius: 16px; background: {{t.surface}}">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <div style="font-size: 16px; font-weight: 500">Accentkleur</div>
          <div style="font-size: 14px; color: {{t.text2}}">{{accentName}}</div>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 2px; margin: 8px -4px 0">
          <sc-for list="{{accentOpts}}" as="ac" hint-placeholder-count="6">
            <button onClick="{{ac.pick}}" aria-label="{{ac.name}}" aria-pressed="{{ac.onStr}}" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; border: {{ac.ring}}; box-sizing: border-box">
              <span style="width: 34px; height: 34px; border-radius: 17px; background: {{ac.hex}}; display: block"></span>
            </button>
          </sc-for>
        </div>
        <div style="font-size: 16px; font-weight: 500; margin: 16px 0 8px">Modus</div>
        <div style="display: flex; padding: 3px; border-radius: 14px; background: {{t.raised}}">
          <sc-for list="{{modeOpts}}" as="mo" hint-placeholder-count="3">
            <button onClick="{{mo.pick}}" aria-pressed="{{mo.onStr}}" style="flex: 1; height: 44px; border-radius: 11px; background: {{mo.bg}}; font-size: 15px; font-weight: 600; color: {{mo.fg}}">{{mo.name}}</button>
          </sc-for>
        </div>
      </div>

      <div style="margin: 24px 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.text2}}">Training</div>
      <div style="padding: 4px 16px; border-radius: 16px; background: {{t.surface}}">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 60px">
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 16px; font-weight: 500">Standaard rusttijd</div>
            <div style="font-size: 13px; color: {{t.text2}}; margin-top: 2px">Na een werkset</div>
          </div>
          <div style="flex: none; display: flex; align-items: center; height: 44px; border-radius: 12px; background: {{t.raised}}">
            <button onClick="{{restDefMinus}}" aria-label="Kortere rust" style="width: 40px; height: 44px; font-size: 20px">−</button>
            <span style="min-width: 48px; text-align: center; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums">{{restDefLabel}}</span>
            <button onClick="{{restDefPlus}}" aria-label="Langere rust" style="width: 40px; height: 44px; font-size: 20px">+</button>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; min-height: 64px">
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 16px; font-weight: 500">Warming-up in superset</div>
            <div style="font-size: 13px; color: {{t.text2}}; margin-top: 2px; line-height: 17px">Eerst direct je eerste werkset, dan wisselen</div>
          </div>
          <button onClick="{{toggleWarm}}" role="switch" aria-checked="{{warmOnStr}}" aria-label="Warming-up in superset" style="flex: none; width: 51px; height: 44px; display: flex; align-items: center">
            <span style="display: block; width: 51px; height: 31px; border-radius: 16px; background: {{toggleBg}}; position: relative">
              <span style="position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF; transform: translateX({{knobX}}); transition: transform 0.2s"></span>
            </span>
          </button>
        </div>
      </div>

      <div style="margin: 24px 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.text2}}">Herinneringen</div>
      <div style="padding: 4px 16px; border-radius: 16px; background: {{t.surface}}">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 64px">
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 16px; font-weight: 500">Creatine</div>
            <div style="font-size: 13px; color: {{t.text2}}; margin-top: 2px">{{creaSub}}</div>
          </div>
          <button onClick="{{toggleCrea}}" role="switch" aria-checked="{{creaStr}}" aria-label="Creatine-herinnering" style="flex: none; width: 51px; height: 44px; display: flex; align-items: center">
            <span style="display: block; width: 51px; height: 31px; border-radius: 16px; background: {{creaBg}}; position: relative">
              <span style="position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF; transform: translateX({{creaX}}); transition: transform 0.2s"></span>
            </span>
          </button>
        </div>
      </div>
      <div style="font-size: 13px; color: {{t.text3}}; margin-top: 16px; line-height: 18px">Later hier ook: kg of lb, gegevens exporteren en een back-up.</div>
    </sc-if>

    <!-- ===== GYM ===== -->
    <sc-if value="{{isGym}}" hint-placeholder-val="{{ false }}">
      <div style="height: 44px; display: flex; align-items: center; font-size: 13px; font-weight: 500; color: {{t.text2}}">Apparaten en gewichtsstappen</div>
      <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.6px">Gym</h1>
      <button onClick="{{openGym}}" style="margin-top: 16px; width: 100%; min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 16px; background: {{t.surface}}; text-align: left">
        <span style="flex: none; width: 36px; height: 36px; border-radius: 18px; background: {{t.raised}}; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.3"></circle></svg>
        </span>
        <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 17px; font-weight: 600">{{gymName}}</span><span style="display: block; font-size: 13px; color: {{t.text2}}; margin-top: 2px">{{gymSub}}</span></span>
        <span style="font-size: 15px; font-weight: 600; color: {{t.accentText}}">Wissel</span>
      </button>
      <div style="margin: 24px 0 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.text2}}">Apparaten in deze gym</div>
      <sc-for list="{{gymEq}}" as="q" hint-placeholder-count="8">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 60px">
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 16px; font-weight: 500; color: {{q.nameColor}}">{{q.name}}</div>
            <div style="font-size: 13px; color: {{t.text2}}; margin-top: 2px">{{q.steps}}</div>
          </div>
          <button onClick="{{q.toggle}}" role="switch" aria-checked="{{q.onStr}}" aria-label="{{q.name}}" style="flex: none; width: 51px; height: 44px; display: flex; align-items: center">
            <span style="display: block; width: 51px; height: 31px; border-radius: 16px; background: {{q.bg}}; position: relative">
              <span style="position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF; transform: translateX({{q.x}}); transition: transform 0.2s"></span>
            </span>
          </button>
        </div>
      </sc-for>
      <button style="margin-top: 12px; width: 100%; height: 52px; border-radius: 16px; background: {{t.raised}}; color: {{t.accentText}}; font-size: 16px; font-weight: 600">+ Apparaat toevoegen</button>
      <div style="font-size: 13px; color: {{t.text3}}; margin-top: 10px; line-height: 18px">Later: een apparaat scannen met je camera, zodat de gewichten vanzelf worden ingevuld.</div>
    </sc-if>
  </div>

  <sc-if value="{{running}}" hint-placeholder-val="{{ true }}">
    <div style="flex: none; padding: 8px 12px 4px; background: {{t.bg}}">
      <div style="display: flex; align-items: center; gap: 8px; height: 68px; padding: 0 12px 0 4px; border-radius: 20px; background: {{t.raised}}">
        <button onClick="{{resume}}" aria-label="Open lopende workout" style="flex: 1; min-width: 0; height: 60px; display: flex; align-items: center; gap: 12px; padding-left: 12px; text-align: left">
          <span style="flex: none; width: 8px; height: 8px; border-radius: 4px; background: {{t.accentLine}}"></span>
          <span style="min-width: 0">
            <span style="display: block; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{miniName}}</span>
            <span style="display: block; font-size: 13px; color: {{t.text2}}; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums">{{miniSub}}</span>
          </span>
        </button>
        <button onClick="{{resume}}" style="flex: none; height: 44px; padding: 0 20px; border-radius: 22px; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 16px; font-weight: 700">Hervat</button>
      </div>
    </div>
  </sc-if>

  <div style="flex: none; display: flex; padding: 2px 8px 30px; background: {{t.bg}}">
    <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3">
      <button onClick="{{tb.go}}" aria-current="{{tb.cur}}" style="flex: 1; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: {{tb.color}}; font-size: 11px; font-weight: 600">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tb.icon}}"></path></svg>
        <span>{{tb.name}}</span>
      </button>
    </sc-for>
  </div>
</div>
</sc-if>

<!-- ================= WERKSCHERM ================= -->
<sc-if value="{{isWorkout}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column">

  <!-- Bovenbalk -->
  <div style="flex: none; padding-top: 47px; background: {{t.bg}}">
    <div style="display: flex; align-items: center; height: 60px; padding: 0 6px">
      <button onClick="{{minimize}}" aria-label="Naar startscherm" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <div style="flex: 1; display: flex; justify-content: space-around; text-align: center">
        <div style="min-width: 76px">
          <div style="font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.3px; line-height: 26px">{{elapsed}}</div>
          <div style="font-size: 12px; font-weight: 500; color: {{t.text2}}">verstreken</div>
        </div>
        <div style="min-width: 76px">
          <div style="font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.3px; line-height: 26px">{{remainNum}}</div>
          <div style="font-size: 12px; font-weight: 500; color: {{t.text2}}">min resterend</div>
        </div>
        <div style="min-width: 76px">
          <div style="font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.3px; line-height: 26px">{{setsLeft}}</div>
          <div style="font-size: 12px; font-weight: 500; color: {{t.text2}}">sets te gaan</div>
        </div>
      </div>
      <button onClick="{{openMenu}}" aria-label="Workoutmenu" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.9"></circle><circle cx="12" cy="12" r="1.9"></circle><circle cx="19" cy="12" r="1.9"></circle></svg>
      </button>
    </div>
    <div style="height: 3px; margin: 0 20px; border-radius: 2px; overflow: hidden; background: {{t.track}}">
      <div style="height: 3px; width: {{progress}}; background: {{t.accentLine}}; border-radius: 2px; transition: width 0.3s ease"></div>
    </div>
  </div>

  <!-- Lijst -->
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px 20px">
    <div style="font-size: 28px; font-weight: 700; letter-spacing: -0.4px">{{title}}</div>
    <div style="font-size: 13px; color: {{t.text2}}; margin: 2px 0 14px">{{subtitle}}</div>

    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 48px 12px; text-align: center">
        <div style="font-size: 17px; font-weight: 600">Nog geen oefeningen</div>
        <div style="font-size: 15px; color: {{t.text2}}; margin: 6px 0 20px">Voeg je eerste oefening toe om te beginnen.</div>
        <button onClick="{{openAdd}}" style="height: 52px; padding: 0 24px; border-radius: 16px; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 17px; font-weight: 700">Oefening toevoegen</button>
      </div>
    </sc-if>

    <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
      <sc-if value="{{it.header}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 6px; margin: 10px 4px 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.text2}}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"></path></svg>
          <span>{{it.label}}</span>
        </div>
      </sc-if>

      <sc-if value="{{it.closed}}" hint-placeholder-val="{{ true }}">
        <button onClick="{{it.tap}}" style="width: 100%; min-height: 58px; display: flex; align-items: center; gap: 12px; padding: 8px 4px; border-radius: 14px; text-align: left; margin-bottom: 2px">
          <span style="flex: none; width: 32px; height: 32px; box-sizing: border-box; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: {{it.iconBg}}; border: {{it.iconBorder}}; color: {{it.iconFg}}; font-size: 12px; font-weight: 700">
            <sc-if value="{{it.isDone}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
            <sc-if value="{{it.showBadge}}"><span>{{it.badge}}</span></sc-if>
          </span>
          <span style="flex: 1; min-width: 0">
            <span style="display: block; font-size: 17px; font-weight: 500; color: {{it.nameColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.name}}</span>
            <span style="display: block; font-size: 13px; color: {{t.text2}}; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.summary}}</span>
          </span>
        </button>
      </sc-if>

      <sc-if value="{{it.open}}" hint-placeholder-val="{{ false }}">
        <div style="background: {{t.surface}}; border-radius: 20px; padding: 16px 0 10px; margin: 4px -8px 10px">
          <div style="display: flex; align-items: flex-start; gap: 10px; padding: 0 16px">
            <sc-if value="{{it.showBadge}}"><span style="flex: none; margin-top: 2px; height: 24px; padding: 0 8px; border-radius: 8px; background: {{t.raised}}; color: {{t.text2}}; font-size: 12px; font-weight: 700; display: flex; align-items: center">{{it.badge}}</span></sc-if>
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 22px; font-weight: 600; letter-spacing: -0.3px; line-height: 28px">{{it.name}}</div>
              <div style="font-size: 13px; color: {{t.text2}}; margin-top: 2px">{{it.meta}}</div>
            </div>
          </div>
          <div style="display: flex; gap: 8px; padding: 12px 16px 6px; overflow-x: auto">
            <button onClick="{{it.explain}}" style="flex: none; height: 44px; padding: 0 14px; border-radius: 22px; background: {{t.raised}}; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M10 8.8v6.4l5-3.2z"></path></svg>Uitleg
            </button>
            <button onClick="{{it.swap}}" style="flex: none; height: 44px; padding: 0 14px; border-radius: 22px; background: {{t.raised}}; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"></path></svg>Bezet
            </button>
            <button onClick="{{it.superset}}" style="flex: none; height: 44px; padding: 0 14px; border-radius: 22px; background: {{t.raised}}; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"></path></svg>Superset
            </button>
          </div>

          <div style="display: flex; align-items: center; height: 28px; padding: 6px 24px 0; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: {{t.text3}}">
            <span style="width: 48px">Set</span><span style="flex: 1">kg</span><span style="flex: 1">Reps</span><span style="width: 40px"></span>
          </div>

          <sc-for list="{{it.sets}}" as="s" hint-placeholder-count="4">
            <div style="position: relative; margin: 0 8px 2px; border-radius: 12px; overflow: hidden; background: {{s.delBg}}">
              <div style="position: absolute; top: 0; bottom: 0; right: 16px; display: flex; align-items: center; gap: 6px; color: {{t.onDanger}}; font-size: 15px; font-weight: 600">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"></path></svg>Verwijder
              </div>
              <div onPointerDown="{{s.down}}" onPointerMove="{{s.move}}" onPointerUp="{{s.up}}" onPointerCancel="{{s.up}}" style="position: relative; display: flex; align-items: center; height: 48px; padding: 0 16px; border-radius: 12px; background: {{s.bg}}; transform: translateX({{s.dx}}px); transition: {{s.trans}}; touch-action: pan-y; user-select: none; -webkit-user-select: none">
                <button onClick="{{s.typeTap}}" aria-label="{{s.typeAria}}" style="flex: none; width: 48px; height: 44px; margin-left: -8px; padding-left: 8px; display: flex; align-items: center">
                  <span style="min-width: 26px; height: 26px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: {{s.chipBg}}; color: {{s.labelColor}}; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{s.label}}</span>
                </button>
                <span style="flex: 1; font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; color: {{s.valColor}}">{{s.w}}</span>
                <span style="flex: 1; font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; color: {{s.valColor}}">{{s.r}}</span>
                <span style="width: 40px; display: flex; justify-content: flex-end; color: {{t.accentText}}">
                  <sc-if value="{{s.done}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-label="Gedaan" role="img"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
                  <sc-if value="{{s.isCur}}"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">Nu</span></sc-if>
                </span>
              </div>
            </div>
          </sc-for>

          <div style="display: flex; gap: 8px; margin: 6px 8px 0">
            <button onClick="{{it.addSet}}" style="flex: 1; height: 44px; border-radius: 12px; background: {{t.raised}}; display: flex; align-items: center; justify-content: center; gap: 6px; color: {{t.accentText}}; font-size: 15px; font-weight: 600">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Set
            </button>
            <button onClick="{{it.addWarm}}" style="flex: 1; height: 44px; border-radius: 12px; background: {{t.raised}}; display: flex; align-items: center; justify-content: center; gap: 6px; color: {{t.warm}}; font-size: 15px; font-weight: 600">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Warming-up
            </button>
          </div>
          <div style="text-align: center; font-size: 12px; color: {{t.text3}}; padding: 8px 16px 2px">Tik op het setnummer voor het type · veeg naar links om te verwijderen</div>
        </div>
      </sc-if>
    </sc-for>
  </div>

  <!-- Onderkant: melding, rusttimer, dock -->
  <div style="flex: none">
    <sc-if value="{{showToast}}" hint-placeholder-val="{{ false }}">
      <div style="margin: 0 12px 8px; height: 52px; padding: 0 6px 0 16px; border-radius: 16px; background: {{t.inverse}}; color: {{t.onInverse}}; display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 15px; font-weight: 500">{{toastText}}</span>
        <button onClick="{{undo}}" style="height: 44px; padding: 0 12px; font-size: 15px; font-weight: 700; color: {{t.onInverse}}; text-decoration: underline">Ongedaan maken</button>
      </div>
    </sc-if>

    <sc-if value="{{resting}}" hint-placeholder-val="{{ false }}">
      <div style="position: relative; margin: 0 12px 8px; height: 56px; border-radius: 16px; overflow: hidden; background: {{t.raised}}">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{restPct}}; background: {{t.accentSoft}}; transition: width 1s linear"></div>
        <div style="position: relative; height: 56px; display: flex; align-items: center; padding: 0 6px 0 14px; gap: 4px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 2.5h6"></path></svg>
          <span style="font-size: 15px; font-weight: 500; margin-left: 4px; color: {{t.text2}}">Rust</span>
          <span style="flex: 1; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin-left: 8px">{{restLeft}}</span>
          <button onClick="{{restMinus}}" aria-label="15 seconden minder" style="width: 48px; height: 44px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">−15</button>
          <button onClick="{{restPlus}}" aria-label="15 seconden meer" style="width: 48px; height: 44px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">+15</button>
          <button onClick="{{restSkip}}" style="height: 44px; padding: 0 14px; border-radius: 22px; background: {{t.surface}}; font-size: 15px; font-weight: 600">Sla over</button>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{showDock}}" hint-placeholder-val="{{ true }}">
      <div style="background: {{t.surface}}; border-radius: 24px 24px 0 0; padding: 12px 16px 28px">
        <div style="display: flex; align-items: baseline; gap: 8px; padding: 0 4px">
          <div style="flex: 1; min-width: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{dockName}}</div>
          <div style="flex: none; font-size: 13px; font-weight: 600; color: {{dockTagColor}}">{{dockTag}}</div>
        </div>
        <div style="font-size: 12px; color: {{t.text2}}; margin-top: 1px; padding: 0 4px; font-variant-numeric: tabular-nums">{{dockPrev}}</div>
        <div style="display: flex; gap: 10px; margin-top: 10px">
          <div style="flex: 1; min-width: 0; height: 52px; display: flex; align-items: center; border-radius: 14px; background: {{t.raised}}">
            <button onClick="{{wMinus}}" aria-label="Minder gewicht" style="flex: none; width: 48px; height: 52px; display: flex; align-items: center; justify-content: center">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
            </button>
            <div style="flex: 1; min-width: 0; text-align: center; white-space: nowrap"><span style="font-size: 26px; font-weight: 600; letter-spacing: -0.5px; font-variant-numeric: tabular-nums">{{dockW}}</span><span style="font-size: 13px; font-weight: 500; color: {{t.text2}}"> kg</span></div>
            <button onClick="{{wPlus}}" aria-label="Meer gewicht" style="flex: none; width: 48px; height: 52px; display: flex; align-items: center; justify-content: center">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </div>
          <div style="flex: 1; min-width: 0; height: 52px; display: flex; align-items: center; border-radius: 14px; background: {{t.raised}}">
            <button onClick="{{rMinus}}" aria-label="Minder reps" style="flex: none; width: 48px; height: 52px; display: flex; align-items: center; justify-content: center">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
            </button>
            <div style="flex: 1; min-width: 0; text-align: center; white-space: nowrap"><span style="font-size: 26px; font-weight: 600; letter-spacing: -0.5px; font-variant-numeric: tabular-nums">{{dockR}}</span><span style="font-size: 13px; font-weight: 500; color: {{t.text2}}"> reps</span></div>
            <button onClick="{{rPlus}}" aria-label="Meer reps" style="flex: none; width: 48px; height: 52px; display: flex; align-items: center; justify-content: center">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </div>
        </div>
        <button onClick="{{complete}}" style="margin-top: 10px; width: 100%; height: 52px; border-radius: 16px; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Set klaar
        </button>
      </div>
    </sc-if>

    <sc-if value="{{showFinish}}" hint-placeholder-val="{{ false }}">
      <div style="background: {{t.surface}}; border-radius: 24px 24px 0 0; padding: 18px 20px 30px">
        <div style="text-align: center; font-size: 15px; color: {{t.text2}}; margin-bottom: 12px">Alle sets gedaan. Sterk werk.</div>
        <button onClick="{{finish}}" style="width: 100%; height: 58px; border-radius: 16px; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 18px; font-weight: 700">Workout afronden</button>
      </div>
    </sc-if>
  </div>
</div>
</sc-if>

<!-- ================= TRAINING-OVERZICHT ================= -->
<sc-if value="{{isOverview}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column">
  <div style="flex: none; padding: 47px 6px 0; display: flex; align-items: center; height: 52px; background: {{t.bg}}">
    <button onClick="{{ovBack}}" style="height: 44px; padding: 0 10px 0 4px; display: flex; align-items: center; gap: 2px; font-size: 17px; color: {{t.accentText}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>{{progName}}
    </button>
    <div style="flex: 1"></div>
    <button onClick="{{ovMore}}" aria-label="Opties voor deze training" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.9"></circle><circle cx="12" cy="12" r="1.9"></circle><circle cx="19" cy="12" r="1.9"></circle></svg>
    </button>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 8px 20px 24px">
    <div style="font-size: 30px; font-weight: 700; letter-spacing: -0.5px">{{ovName}}</div>
    <div style="font-size: 15px; color: {{t.text2}}; margin-top: 4px">{{ovSub}}</div>
    <div style="font-size: 15px; color: {{t.text2}}; margin-top: 2px">{{ovMuscles}}</div>
    <div style="display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: {{t.surface}}; font-size: 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color: {{t.text2}}"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <span>{{ovLast}}</span>
    </div>

    <div style="margin: 22px 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.text2}}">Oefeningen</div>
    <sc-for list="{{ovRows}}" as="or" hint-placeholder-count="5">
      <sc-if value="{{or.header}}">
        <div style="display: flex; align-items: center; gap: 6px; margin: 12px 0 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.text2}}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"></path></svg>Superset
        </div>
      </sc-if>
      <sc-if value="{{or.row}}">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 60px">
          <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: {{t.raised}}; color: {{t.text2}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{or.badge}}</span>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 17px; font-weight: 500">{{or.name}}</div>
            <div style="font-size: 13px; color: {{t.text2}}; margin-top: 2px; font-variant-numeric: tabular-nums">{{or.sub}}</div>
          </div>
        </div>
      </sc-if>
    </sc-for>
  </div>
  <div style="flex: none; padding: 10px 20px 30px; background: {{t.bg}}">
    <button onClick="{{ovStart}}" style="width: 100%; height: 56px; border-radius: 16px; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>Start training
    </button>
  </div>
</div>
</sc-if>

<!-- ================= SCHEMA-EDITOR ================= -->
<sc-if value="{{isEditor}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column">
  <div style="flex: none; padding: 47px 8px 0; display: flex; align-items: center; height: 52px; background: {{t.bg}}">
    <button onClick="{{edCancel}}" style="height: 44px; padding: 0 12px; font-size: 17px; color: {{t.text2}}">Annuleer</button>
    <div style="flex: 1; text-align: center; font-size: 17px; font-weight: 600">{{edTitle}}</div>
    <button onClick="{{edSave}}" style="height: 44px; padding: 0 12px; font-size: 17px; font-weight: 700; color: {{t.accentText}}; opacity: {{edSaveOpacity}}">Bewaar</button>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 12px 20px 40px">
    <label style="display: block">
      <span style="display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.text2}}; margin-bottom: 8px">Naam</span>
      <input value="{{edName}}" onChange="{{edOnName}}" placeholder="Bijv. Push B" style="width: 100%; box-sizing: border-box; height: 56px; padding: 0 16px; border: 0; outline: none; border-radius: 14px; background: {{t.surface}}; font-size: 22px; font-weight: 600; color: {{t.text}}">
    </label>

    <div style="display: flex; align-items: baseline; justify-content: space-between; margin: 24px 0 8px">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.text2}}">Oefeningen</div>
      <div style="font-size: 13px; color: {{t.text2}}; font-variant-numeric: tabular-nums">{{edSummary}}</div>
    </div>

    <sc-if value="{{edEmpty}}">
      <div style="padding: 28px 12px; text-align: center; font-size: 15px; color: {{t.text2}}">Nog geen oefeningen. Voeg je eerste oefening toe.</div>
    </sc-if>

    <sc-for list="{{edItems}}" as="ei" hint-placeholder-count="3">
      <sc-if value="{{ei.showLink}}">
        <div style="display: flex; justify-content: center; margin: -4px 0 4px">
          <button onClick="{{ei.toggleLink}}" aria-pressed="{{ei.linkedStr}}" style="height: 36px; min-width: 44px; padding: 0 12px; border-radius: 18px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; background: {{ei.linkBg}}; color: {{ei.linkFg}}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"></path></svg>{{ei.linkLabel}}
          </button>
        </div>
      </sc-if>
      <div style="background: {{t.surface}}; border-radius: 16px; padding: 12px 8px 12px 16px; margin-bottom: 8px">
        <div style="display: flex; align-items: flex-start; gap: 8px">
          <sc-if value="{{ei.showBadge}}"><span style="flex: none; margin-top: 2px; height: 22px; padding: 0 7px; border-radius: 8px; background: {{t.raised}}; color: {{t.text2}}; font-size: 12px; font-weight: 700; display: flex; align-items: center">{{ei.badge}}</span></sc-if>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 17px; font-weight: 600">{{ei.name}}</div>
            <div style="font-size: 13px; color: {{t.text2}}; margin-top: 2px">{{ei.meta}}</div>
          </div>
          <button onClick="{{ei.up}}" aria-label="Omhoog" style="flex: none; width: 36px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.text2}}; opacity: {{ei.upOpacity}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
          </button>
          <button onClick="{{ei.remove}}" aria-label="Verwijder oefening" style="flex: none; width: 40px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.danger}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"></path></svg>
          </button>
        </div>
        <div style="display: flex; gap: 8px; margin-top: 10px; padding-right: 8px">
          <div style="flex: 1; min-width: 0; height: 44px; display: flex; align-items: center; border-radius: 12px; background: {{t.raised}}">
            <button onClick="{{ei.setsMinus}}" aria-label="Minder sets" style="flex: none; width: 40px; height: 44px; font-size: 20px; font-weight: 500">−</button>
            <div style="flex: 1; text-align: center; white-space: nowrap"><span style="font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums">{{ei.sets}}</span><span style="font-size: 13px; color: {{t.text2}}"> sets</span></div>
            <button onClick="{{ei.setsPlus}}" aria-label="Meer sets" style="flex: none; width: 40px; height: 44px; font-size: 20px; font-weight: 500">+</button>
          </div>
          <div style="flex: 1; min-width: 0; height: 44px; display: flex; align-items: center; border-radius: 12px; background: {{t.raised}}">
            <button onClick="{{ei.repsMinus}}" aria-label="Minder reps" style="flex: none; width: 40px; height: 44px; font-size: 20px; font-weight: 500">−</button>
            <div style="flex: 1; text-align: center; white-space: nowrap"><span style="font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums">{{ei.reps}}</span><span style="font-size: 13px; color: {{t.text2}}"> reps</span></div>
            <button onClick="{{ei.repsPlus}}" aria-label="Meer reps" style="flex: none; width: 40px; height: 44px; font-size: 20px; font-weight: 500">+</button>
          </div>
        </div>
        <button onClick="{{ei.toggleWarm}}" role="switch" aria-checked="{{ei.warmStr}}" style="margin-top: 8px; height: 44px; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500">
          <span style="display: block; width: 42px; height: 26px; border-radius: 13px; background: {{ei.warmBg}}; position: relative">
            <span style="position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; transform: translateX({{ei.warmX}}); transition: transform 0.2s"></span>
          </span>
          <span style="color: {{ei.warmFg}}">Warming-upset</span>
        </button>
      </div>
    </sc-for>

    <button onClick="{{edAdd}}" style="margin-top: 4px; width: 100%; height: 52px; border-radius: 16px; background: {{t.raised}}; color: {{t.accentText}}; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Oefening toevoegen
    </button>
    <div style="font-size: 12px; color: {{t.text3}}; text-align: center; margin-top: 10px; line-height: 17px">Koppel twee oefeningen met de knop ertussen om er een superset van te maken.</div>

    <sc-if value="{{edCanDelete}}">
      <button onClick="{{edDelete}}" style="margin-top: 24px; width: 100%; height: 52px; border-radius: 16px; color: {{t.danger}}; font-size: 16px; font-weight: 600">Training verwijderen</button>
    </sc-if>
  </div>
</div>
</sc-if>

<!-- ================= AFGEROND ================= -->
<sc-if value="{{isSummary}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column">
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 96px 24px 24px">
    <div style="width: 64px; height: 64px; border-radius: 32px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    </div>
    <div style="font-size: 30px; font-weight: 700; letter-spacing: -0.5px; margin-top: 20px">{{sumTitle}}</div>
    <div style="font-size: 15px; color: {{t.text2}}; margin-top: 4px">{{sumNote}}</div>
    <div style="display: flex; gap: 12px; margin: 28px 0 24px">
      <div style="flex: 1"><div style="font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums">{{sumTime}}</div><div style="font-size: 13px; color: {{t.text2}}">duur</div></div>
      <div style="flex: 1"><div style="font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums">{{sumSets}}</div><div style="font-size: 13px; color: {{t.text2}}">sets</div></div>
      <div style="flex: 1.3"><div style="font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums">{{sumVol}}</div><div style="font-size: 13px; color: {{t.text2}}">kg volume</div></div>
    </div>
    <sc-for list="{{sumLines}}" as="ln" hint-placeholder-count="4">
      <div style="padding: 9px 0">
        <div style="font-size: 16px; font-weight: 500">{{ln.name}}</div>
        <div style="font-size: 13px; color: {{t.text2}}; margin-top: 2px; font-variant-numeric: tabular-nums">{{ln.summary}}</div>
      </div>
    </sc-for>
  </div>
  <div style="flex: none; padding: 8px 20px 34px">
    <button onClick="{{goHome}}" style="width: 100%; height: 58px; border-radius: 16px; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 18px; font-weight: 700">Klaar</button>
  </div>
</div>
</sc-if>

<!-- ================= SHEETS ================= -->
<sc-if value="{{anySheet}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 20">
  <button onClick="{{closeSheet}}" aria-label="Sluiten" style="position: absolute; inset: 0; width: 100%; height: 100%; background: {{t.scrim}}"></button>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 740px; display: flex; flex-direction: column; background: {{t.surface}}; border-radius: 24px 24px 0 0">
    <div style="flex: none; width: 36px; height: 5px; border-radius: 3px; background: {{t.line}}; margin: 8px auto 0"></div>
    <div style="flex: none; display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px 4px 20px">
      <div style="flex: 1; min-width: 0; padding-top: 8px">
        <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.2px">{{sheetTitle}}</div>
        <div style="font-size: 14px; color: {{t.text2}}; margin-top: 3px">{{sheetSub}}</div>
      </div>
      <button onClick="{{closeSheet}}" aria-label="Sluiten" style="flex: none; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: {{t.text2}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 8px 20px 34px">

      <!-- Menu -->
      <sc-if value="{{sheetMenu}}">
        <button onClick="{{openAdd}}" style="width: 100%; min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 14px; background: {{t.raised}}; font-size: 17px; font-weight: 500; text-align: left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Oefening toevoegen
        </button>
        <div style="margin: 22px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.text2}}">Instellingen</div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; background: {{t.raised}}">
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 17px; font-weight: 500">Warming-up in superset</div>
            <div style="font-size: 13px; color: {{t.text2}}; margin-top: 3px; line-height: 18px">Na een warming-upset blijf je bij dezelfde oefening en doe je direct de eerste werkset. Daarna wissel je.</div>
          </div>
          <button onClick="{{toggleWarm}}" role="switch" aria-checked="{{warmOnStr}}" aria-label="Warming-up in superset" style="flex: none; width: 51px; height: 44px; display: flex; align-items: center">
            <span style="display: block; width: 51px; height: 31px; border-radius: 16px; background: {{toggleBg}}; position: relative; transition: background 0.2s">
              <span style="position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF; transform: translateX({{knobX}}); transition: transform 0.2s"></span>
            </span>
          </button>
        </div>
        <button onClick="{{openStop}}" style="margin-top: 22px; width: 100%; min-height: 52px; padding: 0 16px; border-radius: 14px; background: {{t.raised}}; color: {{t.danger}}; font-size: 17px; font-weight: 600; text-align: left">Workout stoppen</button>
      </sc-if>

      <!-- Instellingen -->
      <sc-if value="{{sheetSettings}}">
        <div style="margin: 4px 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.text2}}">Accentkleur</div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{accentOpts}}" as="ac" hint-placeholder-count="6">
            <button onClick="{{ac.pick}}" aria-label="{{ac.name}}" aria-pressed="{{ac.onStr}}" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; border: {{ac.ring}}; box-sizing: border-box">
              <span style="width: 34px; height: 34px; border-radius: 17px; background: {{ac.hex}}; display: block"></span>
            </button>
          </sc-for>
        </div>
        <div style="font-size: 14px; color: {{t.text2}}; margin-top: 6px">{{accentName}}</div>

        <div style="margin: 24px 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.text2}}">Weergave</div>
        <div style="display: flex; padding: 3px; border-radius: 14px; background: {{t.raised}}">
          <sc-for list="{{modeOpts}}" as="mo" hint-placeholder-count="3">
            <button onClick="{{mo.pick}}" aria-pressed="{{mo.onStr}}" style="flex: 1; height: 44px; border-radius: 11px; background: {{mo.bg}}; font-size: 15px; font-weight: 600; color: {{mo.fg}}">{{mo.name}}</button>
          </sc-for>
        </div>
        <div style="font-size: 13px; color: {{t.text3}}; margin-top: 16px; line-height: 18px">Later hier ook: standaard rusttijd, kg of lb, en de creatine-herinnering.</div>
      </sc-if>

      <!-- Schema kiezen -->
      <sc-if value="{{sheetProgram}}">
        <sc-for list="{{progList}}" as="pg" hint-placeholder-count="2">
          <button onClick="{{pg.pick}}" style="width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 8px 16px; margin-bottom: 6px; border-radius: 14px; background: {{t.raised}}; text-align: left">
            <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 17px; font-weight: 600">{{pg.name}}</span><span style="display: block; font-size: 13px; color: {{t.text2}}; margin-top: 2px">{{pg.sub}}</span></span>
            <sc-if value="{{pg.on}}"><span style="color: {{t.accentText}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-label="Huidig schema" role="img"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if>
          </button>
        </sc-for>
        <button onClick="{{newProgram}}" style="margin-top: 6px; width: 100%; height: 52px; border-radius: 14px; color: {{t.accentText}}; font-size: 16px; font-weight: 600">+ Nieuw schema</button>
      </sc-if>

      <!-- Opties voor een training -->
      <sc-if value="{{sheetTplmenu}}">
        <button onClick="{{tmEdit}}" style="width: 100%; min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; margin-bottom: 6px; border-radius: 14px; background: {{t.raised}}; font-size: 17px; font-weight: 500; text-align: left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"></path></svg>Training aanpassen
        </button>
        <button onClick="{{tmDuplicate}}" style="width: 100%; min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; margin-bottom: 6px; border-radius: 14px; background: {{t.raised}}; font-size: 17px; font-weight: 500; text-align: left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M8 8h11v11H8zM5 16V5h11"></path></svg>Dupliceren
        </button>
        <button onClick="{{tmRemove}}" style="width: 100%; min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 14px; background: {{t.raised}}; color: {{t.danger}}; font-size: 17px; font-weight: 600; text-align: left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"></path></svg>Verwijderen uit schema
        </button>
      </sc-if>

      <!-- Gym kiezen -->
      <sc-if value="{{sheetGym}}">
        <sc-for list="{{gymList}}" as="g" hint-placeholder-count="2">
          <button onClick="{{g.pick}}" style="width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 8px 16px; margin-bottom: 6px; border-radius: 14px; background: {{t.raised}}; text-align: left">
            <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 17px; font-weight: 600">{{g.name}}</span><span style="display: block; font-size: 13px; color: {{t.text2}}; margin-top: 2px">{{g.sub}}</span></span>
            <sc-if value="{{g.on}}"><span style="color: {{t.accentText}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-label="Gekozen" role="img"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if>
          </button>
        </sc-for>
        <button onClick="{{closeSheet}}" style="margin-top: 6px; width: 100%; height: 52px; border-radius: 14px; color: {{t.accentText}}; font-size: 16px; font-weight: 600">+ Nieuwe gym</button>
      </sc-if>

      <!-- Settype -->
      <sc-if value="{{sheetSettype}}">
        <sc-for list="{{typeOpts}}" as="o" hint-placeholder-count="4">
          <button onClick="{{o.pick}}" style="width: 100%; min-height: 60px; display: flex; align-items: center; gap: 14px; padding: 8px 16px; margin-bottom: 6px; border-radius: 14px; background: {{t.raised}}; text-align: left">
            <span style="flex: none; width: 32px; height: 32px; border-radius: 10px; background: {{t.surface}}; color: {{o.color}}; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{o.letter}}</span>
            <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 17px; font-weight: 600">{{o.name}}</span><span style="display: block; font-size: 13px; color: {{t.text2}}; margin-top: 2px">{{o.desc}}</span></span>
            <sc-if value="{{o.on}}"><span style="color: {{t.accentText}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-label="Gekozen" role="img"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if>
          </button>
        </sc-for>
        <button onClick="{{deleteFromSheet}}" style="margin-top: 8px; width: 100%; min-height: 52px; padding: 0 16px; border-radius: 14px; color: {{t.danger}}; font-size: 17px; font-weight: 600; text-align: left">Set verwijderen</button>
      </sc-if>

    v.minimize = function () { self.setState({ screen: 'home', focusId: null }); };
    v.openMenu = function () { self.openSheet('menu'); };
    v.openAdd = function () { self.openSheet('add'); };
    v.openStop = function () { self.openSheet('stop'); };
    v.wMinus = function () { self.step('w', -1); };
    v.wPlus = function () { self.step('w', 1); };
    v.rMinus = function () { self.step('r', -1); };
    v.rPlus = function () { self.step('r', 1); };
    v.complete = function () { self.complete(); };
    v.finish = function () { self.finish(); };
    v.restMinus = function () { self.setState({ restEnd: Math.max(Date.now() + 1000, self.state.restEnd - 15000) }); };
    v.restPlus = function () { self.setState({ restEnd: self.state.restEnd + 15000, restTotal: self.state.restTotal + 15 }); };
    v.restSkip = function () { self.setState({ restEnd: 0 }); };
    v.showToast = !!(st.toast && st.toast.until > now && s);
    v.toastText = st.toast ? st.toast.text : '';
    v.undo = function () { self.undo(); };

    // ----- afgerond -----
    var sm = st.summary || { title: '', note: '', time: '', sets: '', vol: '', lines: [] };
    v.sumTitle = sm.title; v.sumNote = sm.note; v.sumTime = sm.time; v.sumSets = sm.sets; v.sumVol = sm.vol; v.sumLines = sm.lines;
    v.goHome = function () { self.setState({ screen: 'home', summary: null }); };

    // ----- sheets -----
    var sh = st.sheet;
    v.anySheet = !!sh;
    v.closeSheet = function () { self.setState({ sheet: null }); };
    ['menu', 'stop', 'start', 'explain', 'swap', 'superset', 'add', 'settype', 'gym', 'settings', 'program', 'tplmenu'].forEach(function (k) {
      v['sheet' + k.charAt(0).toUpperCase() + k.slice(1)] = sh === k;
    });
    var sx = s && st.sheetEx ? this.findEx(s, st.sheetEx) : null;
    var titles = {
      menu: ['Workout', s ? s.name + ' · ' + clock(now - s.startAt) : ''],
      stop: ['Workout stoppen?', ''],
      start: ['Er loopt al een workout', ''],
      explain: ['Uitleg', sx ? sx.name : ''],
      swap: ['Machine bezet', sx ? 'Vervang ' + sx.name + ' voor de sets die nog open staan. Gedane sets blijven staan.' : ''],
      superset: ['Superset', sx ? 'Koppel oefeningen aan ' + sx.name + '. Je wisselt na elke set.' : ''],
      add: ['Oefening toevoegen', st.addTarget === 'draft' ? 'Wordt onderaan je schema gezet' : 'Wordt onderaan je workout gezet'],
      settings: ['Instellingen', 'Kleur en weergave van de app'],
      program: ['Kies je schema', 'Je schema bepaalt welke trainingen je op het startscherm ziet.'],
      tplmenu: [st.tmName || '', 'Opties voor deze training'],
      settype: ['Soort set', sx ? sx.name : ''],
      gym: ['Kies je gym', 'Machine bezet en de plus/min-stappen volgen de apparaten van deze gym.']
    };
    var tt = titles[sh] || ['', ''];
    v.sheetTitle = tt[0]; v.sheetSub = tt[1];
    v.typeOpts = [];
    if (sh === 'settype' && sx) {
      var tset = sx.sets.filter(function (y) { return y.id === st.sheetSet; })[0];
      if (tset) {
        v.typeOpts = ['w', 's', 'd', 'f'].map(function (k) {
          var T = TYPES[k];
          return {
            letter: T.letter, name: T.name, desc: T.desc, on: tset.k === k,
            color: k === 'w' ? t.warm : k === 'd' ? t.drop : k === 'f' ? t.danger : t.text,
            pick: function () { self.setType(sx.id, tset.id, k); }
          };
        });
      }
    }
    v.deleteFromSheet = function () { var ex = self.state.sheetEx, id = self.state.sheetSet; self.setState({ sheet: null }); self.deleteSet(ex, id); };
    if (sh === 'stop' && s) {
      var open = 0; s.exs.forEach(function (e) { e.sets.forEach(function (x) { if (x.k !== 'w' && !x.done) open++; }); });
      v.sheetSub = (open === 1 ? 'Er staat nog 1 set open.' : 'Er staan nog ' + open + ' sets open.') + ' Je gedane sets worden bewaard.';
    }
    if (sh === 'start' && s) {
      v.sheetSub = s.name + ' loopt al ' + Math.max(1, Math.round((now - s.startAt) / 60000)) + ' min.';
      v.startResumeLabel = 'Hervat ' + s.name;
      v.startReplaceLabel = 'Stop ' + s.name + ' en start ' + (st.pending || 'lege training');
    }
    v.resumeFromSheet = function () { self.setState({ sheet: null, screen: 'workout' }); };
    v.startReplace = function () { self.doStart(self.state.pending); };
    v.stopSave = function () { self.finish('Eerder gestopt. Je gedane sets zijn opgeslagen.'); };
    v.stopDiscard = function () { self.setState({ session: null, sheet: null, screen: 'home', restEnd: 0 }); };
    v.warmOnStr = st.warmFirst ? 'true' : 'false';
    v.toggleBg = st.warmFirst ? t.accentLine : t.line;
    v.knobX = st.warmFirst ? '20px' : '0px';
    v.toggleWarm = function () { self.setState({ warmFirst: !self.state.warmFirst }); };

    // uitleg
    var exName = sx ? sx.name : '';
    v.ytUrl = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(exName + ' form');
    v.hasLink = !!st.links[exName];
    v.savedLink = st.links[exName] || '';
    v.linkDraft = st.linkDraft;
    v.onLink = function (ev) { self.setState({ linkDraft: ev.target.value }); };
    v.saveLink = function () {
      var u = (self.state.linkDraft || '').trim(); if (!u) return;
      if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      var L = Object.assign({}, self.state.links); L[exName] = u;
      self.setState({ links: L, linkDraft: '' });
    };
    v.clearLink = function () { var L = Object.assign({}, self.state.links); delete L[exName]; self.setState({ links: L }); };

    // bezet
    var inWorkout = s ? s.exs.map(function (e) { return e.name; }) : [];
    var sug = suggestFor(exName, inWorkout);
    v.swapSuggest = { name: sug, meta: meta(sug), pick: function () { self.swapTo(sug, false); } };
    var pref = st.prefs[(sx && sx.from) || exName] || st.prefs[exName];
    v.hasPref = !!pref; v.noPref = !pref;
    v.swapPref = pref ? { name: pref, meta: meta(pref), pick: function () { self.swapTo(pref, false); } } : { name: '', meta: '', pick: null };
    v.savePrefStr = st.savePref ? 'true' : 'false';
    v.prefBg = st.savePref ? t.accentLine : t.line;
    v.prefKnobX = st.savePref ? '20px' : '0px';
    v.togglePref = function () { self.setState({ savePref: !self.state.savePref }); };

    // superset
    v.ssInGroup = false; v.ssCandidates = [];
    if (sh === 'superset' && s && sx) {
      v.ssInGroup = s.exs.filter(function (e) { return e.group === sx.group; }).length > 1;
      v.ssCandidates = s.exs.filter(function (e) {
        return e.group !== sx.group && e.sets.some(function (x) { return !x.done; });
      }).map(function (e) {
        var on = st.sel.indexOf(e.id) >= 0;
        return {
          name: e.name, meta: exSummary(e), on: on, onStr: on ? 'true' : 'false',
          ringBg: on ? t.accentLine : 'transparent', ringBorder: on ? '0' : '2px solid ' + t.line,
          toggle: function () {
            var sel = self.state.sel.slice(), i = sel.indexOf(e.id);
            if (i >= 0) sel.splice(i, 1); else sel.push(e.id);
            self.setState({ sel: sel });
          }
        };
      });
    }
    v.ssNoCandidates = v.ssCandidates.length === 0;
    var nSel = st.sel.length + st.selNew.length;
    v.ssBtnLabel = nSel ? 'Koppelen (' + nSel + ')' : 'Kies minstens één oefening';
    v.ssBtnOpacity = nSel ? '1' : '0.45';
    v.ssLink = function () { self.link(); };
    v.ssUnlink = function () { self.unlink(); };

    // zoeken
    v.showSearch = sh === 'add' || sh === 'swap' || sh === 'superset';
    v.q = st.q;
    v.onQ = function (ev) { self.setState({ q: ev.target.value }); };
    var q = (st.q || '').toLowerCase().trim();
    var baseMuscle = sx ? lib(sx.name).m : '';
    var names = Object.keys(LIB).filter(function (n) {
      if (sh === 'swap' && sx && n === sx.name) return false;
      return !q || n.toLowerCase().indexOf(q) >= 0 || LIB[n].m.toLowerCase().indexOf(q) >= 0;
    });
    if (sh === 'swap' && !q) names.sort(function (a, b) { return (LIB[a].m === baseMuscle ? 0 : 1) - (LIB[b].m === baseMuscle ? 0 : 1); });
    var plus = 'M12 5v14M5 12h14', swapI = 'M4 8h14l-3.5-3.5M20 16H6l3.5 3.5', check = 'M5 12.5l4.5 4.5L19 7.5';
    v.results = names.slice(0, 8).map(function (n) {
      var chosen = sh === 'superset' && st.selNew.indexOf(n) >= 0;
      return {
        name: n, meta: meta(n),
        iconBg: chosen ? t.accentLine : t.raised, iconFg: chosen ? t.onAccent : t.text,
        iconPath: sh === 'swap' ? swapI : (chosen ? check : plus),
        pick: function () {
          if (sh === 'add' && self.state.addTarget === 'draft') {
            var d2 = clone(self.state.draft), l = lib(n);
            d2.items.push({ id: uid(), n: n, warm: false, warmW: null, sets: 3, reps: 10, w: l.d, link: false });
            self.setState({ draft: d2, sheet: null });
          } else if (sh === 'add') self.addExercise(n);
          else if (sh === 'swap') self.swapTo(n, true);
          else {
            var sn = self.state.selNew.slice(), i = sn.indexOf(n);
            if (i >= 0) sn.splice(i, 1); else sn.push(n);
            self.setState({ selNew: sn });
          }
        }
      };
    });
    v.noResults = v.results.length === 0;
    return v;
  }
}
</script>

<script>
(function () {
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
  var mode = mq && mq.matches ? 'light' : 'dark';
  var app = window.__mount(Component, { theme: mode, accent: '#556B2F' });

  var buttons = document.querySelectorAll('.seg button');
  function setMode(m) {
    mode = m;
    app.setProps({ theme: m });
    document.documentElement.setAttribute('data-theme', m);
    buttons.forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-mode') === m ? 'true' : 'false'); });
  }
  buttons.forEach(function (b) { b.addEventListener('click', function () { setMode(b.getAttribute('data-mode')); }); });
  if (mq && mq.addEventListener) mq.addEventListener('change', function (e) { setMode(e.matches ? 'light' : 'dark'); });
  setMode(mode);

  // Telefoon passend maken in het venster
  var stage = document.getElementById('stage'), phone = document.getElementById('root');
  function fit() {
    var w = window.innerWidth, h = window.innerHeight;
    var bare = w < 500;
    document.body.classList.toggle('bare', bare);
    var s = bare ? Math.min(w / 390, h / 844) : Math.min(1, (w - 60) / 390, (h - 90) / 844);
    if (bare && h / w > 844 / 390) {
      // langer scherm dan 390x844: breedte vullen
      s = w / 390;
    }
    phone.style.transform = 'scale(' + s + ')';
    stage.style.width = Math.round(390 * s) + 'px';
    stage.style.height = Math.round(Math.min(844 * s, bare ? h : 844 * s)) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
</body>
